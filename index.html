<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>


  <!-- بداية سكشن ٥ -->

    <div class="sec5">
      <div class="container5">
        <div class="hedar5">
          <h1>Ready to Start Your Fitness Journey?</h1>
          <p>
            Join FitCore today and get access to premium facilities, expert
            guidance, and a community that supports your goals.
          </p>
        </div>

        <div class="form">
          <div class="personalname">
            <div class="fn">
              <label for="fn">First Name</label><br />
              <input
                id="fn"
                type="text"
                placeholder="Enter your first name"
                name="fn"
              />
            </div>

            <div class="ln">
              <label for="ln">First Name</label><br />
              <input
                id="ln"
                type="text"
                placeholder="Enter your last name"
                name="fn"
              />
            </div>

            <div class="clr"></div>

            <div class="ln"></div>
          </div>

          <div class="email">
            <label for="email">Email address</label><br />
            <input
              id="email"
              type="email"
              placeholder="your.eamail@example.com"
              name="email"
            />
          </div>

          <div class="numberf">
            <label for="number">phone number</label> <br />
            <input
              id="number"
              type="number"
              placeholder="(555)123-4567"
              name="number"
            />
          </div>

          <div class="select">
            <label for="select">Membership Type</label> <br />
            <select id="select" name="select">
              <option value="1">Basic Membership -30$/month</option>
              <option value="2">premium Membership -49$/month</option>
              <option value="3">vip Membership 79$/moth</option>
            </select>
          </div>

          <div class="textarea">
            <label for="textarea">Fitness Goals</label><br />
            <textarea
              id="textarea"
              name="textarea"
              placeholder="tell us about your fitness goals "
            ></textarea>
          </div>

          <div class="lastbtn">
            <button type="button">join fitCore Today</button>
          </div>

          <p>
            By submitting this form, you agree to our terms of service and
            privacy policy.
          </p>
        </div>
      </div>
    </div>
    <!-- نهاية سكشن ٥ -->


</body>

</html>
